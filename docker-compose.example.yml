services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      STATIC_DIR: /app/public
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/application_tracker?schema=public
    ports:
      - "3000:3000"
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: application_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_example_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d application_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_example_data:
